server:
  port: 8080

spring:
  application:
    name: laptopverse-api-dev
  datasource:
    url: jdbc:h2:mem:laptopversedb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

# JWT
jwt:
  secret: QuestaEunaChiaveSegretaMoltoLungaEComplessaPerHS256!
  http-only: false
  cookie-secure: false
  cookie-same-site: Strict
  # Valore in millisecondi (15 minuti)
  time-expired-access-ms: 900000
  # Valore in millisecondi (7 giorni)
  time-expired-refresh-ms: 604800000

logging:
  level:
    root: INFO
    com.laptopverse: DEBUG